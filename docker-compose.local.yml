name: task-manager-local

services:
  # Backend Spring Boot (Local - H2 Database por padrão)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.local
    container_name: task-manager-api-local
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - PORT=8080
    restart: unless-stopped

  # Frontend Angular (Local - Dev Server)
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile.local
    container_name: task-manager-ui-local
    ports:
      - "4200:4200"
    depends_on:
      - api
    restart: unless-stopped

networks:
  default:
    name: task-manager-local-network
