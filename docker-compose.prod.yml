name: task-manager-prod

services:
  # Backend Spring Boot (Produção - PostgreSQL / Neon)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    container_name: task-manager-api-prod
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - PORT=8080
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    restart: unless-stopped

  # Frontend Angular (Produção - Nginx Alpine)
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile.prod
    container_name: task-manager-ui-prod
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

networks:
  default:
    name: task-manager-prod-network
