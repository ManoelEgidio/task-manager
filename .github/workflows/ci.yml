name: CI - Build & Testes Backend

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Compilar, Testar e Gerar Cobertura JaCoCo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Dar Permissão de Execução ao Gradle Wrapper
        run: chmod +x api/gradlew

      - name: Executar Testes e Gerar Relatório JaCoCo
        working-directory: ./api
        run: ./gradlew test jacocoTestReport

      - name: Upload do Relatório de Cobertura (JaCoCo HTML)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: api/build/reports/jacoco/test/html/
