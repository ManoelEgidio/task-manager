name: CI/CD - Pipeline Fullstack & Cloud Run Deploy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REGISTRY_REPO: task-manager-repo
  BACKEND_SERVICE: task-manager-api
  FRONTEND_SERVICE: task-manager-ui

jobs:
  # ----------------------------------------------------
  # JOB 1: TESTES & COBERTURA BACKEND
  # ----------------------------------------------------
  backend-test:
    name: Compilar, Testar Backend (Java 21) & JaCoCo
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Dar Permissão ao Gradle Wrapper
        run: chmod +x api/gradlew

      - name: Executar Testes e Gerar JaCoCo
        working-directory: ./api
        run: ./gradlew test jacocoTestReport

      - name: Upload do Relatório JaCoCo (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: api/build/reports/jacoco/test/html/

  # ----------------------------------------------------
  # JOB 2: TESTES & BUILD FRONTEND
  # ----------------------------------------------------
  frontend-test:
    name: Testar & Compilar Frontend (Angular 20)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Configurar Node.js 22 & Cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: './ui/pnpm-lock.yaml'

      - name: Instalar Dependências do Frontend
        working-directory: ./ui
        run: pnpm install --frozen-lockfile

      - name: Executar Testes Unitários do Angular
        working-directory: ./ui
        run: pnpm test --watch=false --browsers=ChromeHeadless

      - name: Build de Produção do Angular
        working-directory: ./ui
        run: pnpm build --configuration production

  # ----------------------------------------------------
  # JOB 3: DEPLOY NO GOOGLE CLOUD RUN (Apenas na Main após Testes)
  # ----------------------------------------------------
  deploy-cloud-run:
    name: Deploy Automático no Google Cloud Run
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Autenticar no Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Autenticar Docker no Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build e Push Imagem Backend
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }}"
          docker build -t $IMAGE_URI -f api/Dockerfile.prod ./api
          docker push $IMAGE_URI

      - name: Deploy Backend no Cloud Run
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.BACKEND_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }}
          env_vars: |
            SPRING_PROFILES_ACTIVE=prod
            SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
            SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          flags: '--allow-unauthenticated --port=8080'

      - name: Build e Push Imagem Frontend
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.FRONTEND_SERVICE }}:${{ github.sha }}"
          docker build -t $IMAGE_URI -f ui/Dockerfile.prod ./ui
          docker push $IMAGE_URI

      - name: Deploy Frontend no Cloud Run
        id: deploy-frontend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.FRONTEND_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.FRONTEND_SERVICE }}:${{ github.sha }}
          flags: '--allow-unauthenticated --port=80'
